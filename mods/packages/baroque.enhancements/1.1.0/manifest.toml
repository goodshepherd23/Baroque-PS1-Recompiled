format_version = 5
id = "baroque.enhancements"
version = "1.1.0"
name = "Baroque Enhancements"
author = "goodshepherd23"
description = "Optional changes to Baroque (SLPM-86328, English v1.02) beyond the original game."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86328"

[[feature]]
id = "view-distance"
name = "Longer View Distance"
description = "In the tower, draws corridors four times as far and pushes the darkness back to match, so about one more lit stretch of corridor shows where the original goes black. The darkness that hides farther areas is part of the game's look, and past that stretch there is a further limit this does not change."
group = "Graphics"
default_enabled = false

[[plugin]]
feature = "view-distance"
id = "baroque.enhancement.view-distance"

[[feature]]
id = "achievements"
name = "Recomp Achievements"
description = "Earn achievements while you play, when the game is started from RecompLauncher (recomplauncher.com/achievements). Started any other way it does nothing. Loading a save state or rewinding makes later unlocks count as Casual instead of Ranked."
group = "Achievements"
default_enabled = true

[[plugin]]
feature = "achievements"
id = "baroque.achievements"

[[feature]]
id = "infinite-hp"
name = "Infinite HP"
description = "Refills your HP to its maximum every frame. Turning on any cheat makes achievements you unlock afterwards count as Casual instead of Ranked."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "infinite-hp"
id = "baroque.cheat.infinite-hp"

[[feature]]
id = "infinite-vitality"
name = "Infinite Vitality"
description = "Keeps Vitality full, so it never runs down and starts draining HP. Turning on any cheat makes achievements you unlock afterwards count as Casual instead of Ranked."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "infinite-vitality"
id = "baroque.cheat.infinite-vitality"

[[feature]]
id = "max-stats"
name = "Attack and Defence 99"
description = "Sets your base Attack and Defence to 99. The new values are kept in your save, so turning this off later does not put them back. Turning on any cheat makes achievements you unlock afterwards count as Casual instead of Ranked."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "max-stats"
id = "baroque.cheat.max-stats"
